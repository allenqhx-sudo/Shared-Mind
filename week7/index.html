<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thought Space</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="landscape" aria-hidden="true"></div>
    <section id="auth-panel" aria-labelledby="auth-title">
      <form id="auth-form">
        <h1 id="auth-title">Sign in</h1>
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required maxlength="254" disabled />
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="6" disabled />
        <button id="email-sign-in" class="action-button" type="submit" disabled>Sign In</button>
        <button id="google-sign-in" class="action-button" type="button" disabled>Continue with Google</button>
        <button id="auth-toggle" class="text-button" type="button" disabled>Create account</button>
        <p id="auth-message" class="small-message" role="status" aria-live="polite">Checking sign-in...</p>
      </form>
    </section>
    <div id="account-controls" hidden>
      <button id="profile-button" type="button" aria-label="Edit profile" aria-haspopup="dialog">
        <span class="avatar"><img id="account-avatar" alt="" hidden referrerpolicy="no-referrer" /></span>
        <span id="account-name" class="visually-hidden">User</span>
      </button>
      <button id="sign-out-button" class="text-button" type="button">Sign Out</button>
    </div>
    <dialog id="profile-dialog" aria-labelledby="profile-title">
      <form id="profile-form">
        <h2 id="profile-title">Profile</h2>
        <span class="avatar profile-preview"><img id="profile-preview" alt="Avatar preview" hidden referrerpolicy="no-referrer" /></span>
        <label for="profile-name">Display name</label>
        <input id="profile-name" type="text" autocomplete="nickname" required maxlength="50" />
        <label for="profile-image">Profile image</label>
        <input id="profile-image" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="image-help" />
        <p id="image-help" class="small-message">JPG, PNG or WebP · up to 5 MB</p>
        <div class="profile-buttons">
          <button id="profile-save" class="action-button" type="submit">Save</button>
          <button id="profile-cancel" class="text-button" type="button">Cancel</button>
        </div>
        <p id="profile-message" class="small-message" role="status" aria-live="polite"></p>
      </form>
    </dialog>
    <main id="space" aria-label="Thoughts / 想法" hidden>
      <div id="scene-container"></div>
      <button id="reset-view" class="text-button" type="button" aria-label="Reset camera view">Reset View</button>
      <!-- Profiles and thought text remain sharp HTML above the 3D canvas. -->
      <div id="thoughts" role="group" aria-label="Thought bubbles / 想法气泡"></div>
      <div id="pending-actions" role="group" aria-label="Pending thought" hidden>
        <button id="add-pending-button" class="action-button" type="button">Add to Space</button>
        <button id="delete-pending-button" class="action-button" type="button">Delete</button>
      </div>
    </main>
    <div class="composer" hidden>
      <div class="input-control">
        <svg class="input-plants input-plants--left plants-back" viewBox="0 0 100 144" aria-hidden="true" focusable="false">
          <g class="plant-reaction">
            <g class="plant-sway plant-sway--tall" style="--plant-origin: 68px 190px; --plant-period: 8.4s; --plant-delay: -2.6s; --plant-sway: 0.7deg">
              <path class="plant-stem" d="M 68 206 C 72 167 60 133 59 112 C 56 83 59 60 44 37" />
              <path d="M 35 31 C 32 26 37 22 41 24 C 44 18 49 22 50 25 C 57 25 56 33 51 35 C 49 40 40 39 39 35 C 35 36 33 34 35 31 Z" />
              <path d="M 57 78 C 44 77 43 70 46 68 C 52 67 57 73 57 78 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 55px 180px; --plant-period: 6.3s; --plant-delay: -4.1s; --plant-sway: 1deg">
              <path class="plant-stem" d="M 55 198 C 59 167 31 134 29 109 C 25 91 31 83 23 69" />
              <path d="M 23 71 C 17 70 16 61 20 57 C 23 53 29 61 28 66 C 27 69 26 70 23 71 Z" />
              <path class="plant-stem" d="M 30 113 Q 16 106 15 97" />
              <path d="M 15 99 Q 6 94 12 89 Q 20 91 15 99 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 65px 180px; --plant-period: 7.2s; --plant-delay: -1.3s; --plant-sway: 1.1deg">
              <path class="plant-stem" d="M 65 194 C 66 158 47 131 49 97" />
              <path d="M 39 95 C 39 87 45 83 49 84 C 54 83 61 91 59 94 C 55 97 44 98 39 95 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 69px 160px; --plant-period: 5.8s; --plant-delay: -3.4s; --plant-sway: 1.3deg">
              <path d="M 64 169 C 66 151 57 134 52 129 C 63 132 67 145 68 150 C 67 134 72 120 76 117 C 73 133 71 143 72 153 C 75 141 80 138 83 138 C 76 148 72 158 71 169 Z" />
            </g>
          </g>
        </svg>
        <svg class="input-plants input-plants--left plants-front" viewBox="0 0 100 144" aria-hidden="true" focusable="false">
          <g class="plant-reaction">
            <g class="plant-sway" style="--plant-origin: 64px 170px; --plant-period: 7.7s; --plant-delay: -5.3s; --plant-sway: 0.7deg">
              <path class="plant-stem" d="M 64 180 C 61 152 65 125 70 114" />
              <path d="M 69 116 C 67 111 69 107 74 106 C 75 111 73 115 69 116 Z" />
            </g>
          </g>
        </svg>
        <input id="thought-input" type="text" aria-label="Type a thought / 写下一个想法" placeholder="Type a thought / 写下一个想法" autocomplete="off" spellcheck="false" enterkeyhint="done" />
        <svg class="input-plants input-plants--right plants-back" viewBox="0 0 100 144" aria-hidden="true" focusable="false">
          <g class="plant-reaction">
            <g class="plant-sway plant-sway--tall" style="--plant-origin: 35px 190px; --plant-period: 7.6s; --plant-delay: -6.1s; --plant-sway: 0.7deg">
              <path class="plant-stem" d="M 35 207 C 29 177 48 145 47 121 C 46 96 61 74 59 51" />
              <path d="M 52 51 C 48 47 51 41 56 41 C 57 37 62 38 64 41 C 70 42 72 47 68 51 C 68 55 61 58 58 54 C 54 57 50 55 52 51 Z" />
              <path class="plant-stem" d="M 48 104 Q 61 94 65 83" />
              <path d="M 64 86 C 61 81 66 75 70 77 C 73 81 68 86 64 86 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 42px 175px; --plant-period: 8.8s; --plant-delay: -1.8s; --plant-sway: 0.9deg">
              <path class="plant-stem" d="M 42 192 C 34 156 33 125 29 108" />
              <path d="M 23 107 C 19 101 25 92 27 88 C 29 95 37 96 36 103 C 35 111 27 112 23 107 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 40px 180px; --plant-period: 6.6s; --plant-delay: -3.7s; --plant-sway: 1.1deg">
              <path class="plant-stem" d="M 40 197 C 41 166 61 144 61 123" />
              <path d="M 53 122 C 52 117 57 111 62 113 C 66 111 72 117 70 120 C 66 124 58 124 53 122 Z" />
            </g>
            <g class="plant-sway" style="--plant-origin: 38px 167px; --plant-period: 5.5s; --plant-delay: -0.8s; --plant-sway: 1.2deg">
              <path d="M 34 177 C 34 162 29 151 25 145 C 34 148 36 155 37 161 C 37 149 41 141 46 136 C 42 149 41 160 40 164 C 43 155 49 153 53 153 C 45 163 41 169 41 178 Z" />
            </g>
          </g>
        </svg>
        <svg class="input-plants input-plants--right plants-front" viewBox="0 0 100 144" aria-hidden="true" focusable="false">
          <g class="plant-reaction">
            <g class="plant-sway" style="--plant-origin: 35px 170px; --plant-period: 8.1s; --plant-delay: -4.6s; --plant-sway: 0.7deg">
              <path class="plant-stem" d="M 35 182 C 40 155 36 132 29 120" />
              <path d="M 29 122 C 25 119 25 115 27 113 C 32 114 34 119 29 122 Z" />
            </g>
          </g>
        </svg>
      </div>
      <button id="generate-button" class="action-button goo-action" type="button" disabled>
        <span class="control-eyes" aria-hidden="true"><span class="control-eye"><span class="control-pupil"></span></span><span class="control-eye"><span class="control-pupil"></span></span></span>
        <span class="action-label">Generate</span>
      </button>
      <button id="delete-button" class="action-button" type="button" disabled>Delete</button>
      <p id="selection-message" role="status" aria-live="polite"></p>
    </div>
    <script type="importmap">
      {"imports": {
        "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
      }}
    </script>
    <script>
      (() => {
        const message = document.querySelector("#auth-message");
        const reportStartupError = (error) => {
          console.error("Shared Thought Space could not start", error);
          message.textContent = location.protocol === "file:"
            ? "Open http://localhost:8000 instead of opening this file directly."
            : "Could not load sign-in. Check your connection and reload the page.";
        };
        // A local file cannot load the app's ES module. Report this before loading it.
        if (location.protocol === "file:") {
          reportStartupError(new Error("Open this project through its local HTTP server, not file://."));
          return;
        }
        const timeout = setTimeout(() => {
          reportStartupError(new Error("Loading the application or Firebase modules timed out."));
        }, 15000);
        import("./app.js").then(() => clearTimeout(timeout), (error) => {
          clearTimeout(timeout);
          reportStartupError(error);
        });
      })();
    </script>
  </body>
</html>
